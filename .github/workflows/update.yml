name: Update Shadowrocket Config

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Config
        run: |
          mkdir -p output
          curl -L \
          https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_top500_banlist_ad.conf \
          -o output/shadowrocket.conf

      - name: Show First Lines
        run: |
          head -20 output/shadowrocket.conf

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add output/shadowrocket.conf

          git diff --cached --quiet || git commit -m "Auto update Shadowrocket config"

          git push